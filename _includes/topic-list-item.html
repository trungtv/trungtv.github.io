{% include base_path %}

<li class="topics__item">
  <a class="topics__link" href="{{ base_path }}{{ post.url }}">
    <span class="topics__item-main">
      <span class="topics__item-title">{{ post.title | markdownify | strip_html | strip }}</span>
      {% if post.summary %}
        <span class="topics__item-summary">{{ post.summary | escape }}</span>
      {% endif %}
    </span>
    <span class="status-badge status-badge--{{ post.topic_status }}">{{ post.topic_status }}</span>
  </a>
</li>
