{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Kill intro fade immediately (also bypasses stale CDN-cached main.css) -->
<style>
  .masthead, #main, .page__footer, .breadcrumbs, .page__hero, .page__hero--overlay, .greedy-nav {
    -webkit-animation: none !important;
            animation: none !important;
  }
</style>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ base_path }}/assets/css/no-intro.css?v={{ site.time | date: '%s' }}">
